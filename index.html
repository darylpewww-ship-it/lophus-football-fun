<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lophus Football Fun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a cheeky matchday programme crossed with the club office ledger
   IDEA: the manager's desk — fixtures card, inbox, ledger, trophy cabinet
   PICTURE: the live 2D pitch and the crest-vs-crest next-match card
   COLOUR and TYPE: chalk ground, signal red office brand, pitch green for good news, gold for honours; Big Shoulders Display + Barlow
   LAYOUT: phone-first single column with bottom nav; side rail above 900px */
:root{color-scheme:light dark;
--bg:light-dark(#efeee8,#111413);--card:light-dark(#ffffff,#1b1f1d);--card2:light-dark(#f6f5f0,#232826);
--ink:light-dark(#17191a,#eef1ed);--mut:light-dark(#676c68,#9aa29d);--line:light-dark(#e0dfd7,#2e3431);
--red:#e2412a;--red2:light-dark(#c3311c,#ff6b52);--redbg:light-dark(#fde9e4,#3a1d18);
--grn:light-dark(#18804a,#3fcf7d);--grnbg:light-dark(#e3f3e9,#173326);
--gold:light-dark(#9a6a12,#e9b24b);--goldbg:light-dark(#f8efdc,#352a15);
--blue:light-dark(#2459b8,#7aa5f5);--bluebg:light-dark(#e6eefc,#1b2741);
--pitch:#2e6a3c;--pitch2:#357546}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;line-height:1.05;margin:0}
h1{font-size:34px}h2{font-size:26px}h3{font-size:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:1100px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px}
#top .t1{font-weight:700;font-size:15px;line-height:1.2}#top .t2{color:var(--mut);font-size:13px}
#top .right{margin-left:auto;text-align:right}
#top .date{font-family:"Big Shoulders Display";font-weight:800;font-size:20px;line-height:1}
#view{flex:1;padding:16px 16px 100px}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
#nav button{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--mut);position:relative;min-height:56px}
#nav button.on{color:var(--red2)}#nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--red);border-radius:0 0 3px 3px}
#nav svg{width:24px;height:24px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:0 6px;line-height:18px}
@media(min-width:900px){#app{flex-direction:row;flex-wrap:wrap}#top{width:100%}#nav{position:sticky;top:60px;align-self:flex-start;width:120px;display:flex;flex-direction:column;border:0;background:none;padding-top:12px}#nav button{flex-direction:row;justify-content:flex-start;gap:10px;padding:12px 14px;font-size:15px}#nav button.on::before{left:0;right:auto;top:20%;bottom:20%;width:3px;height:auto}.badge{position:static}#view{width:calc(100% - 120px);padding-bottom:40px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card.flat{background:var(--card2)}
.lbl{color:var(--mut);font-size:13px;font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.sp{margin-left:auto}
.mut{color:var(--mut)}.sm{font-size:13px}.b{font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:420px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn{border:0;border-radius:14px;padding:12px 18px;min-height:44px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.btn.pri{background:var(--red);color:#fff;border-color:var(--red);font-family:"Big Shoulders Display";font-size:22px;letter-spacing:.01em}
.btn.grn{background:var(--grn);color:#fff;border-color:var(--grn)}
.btn.ghost{background:none}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,#nav button:focus-visible,.tabs button:focus-visible,.li:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.tabs{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:9px 10px;font-family:"Big Shoulders Display";font-weight:800;font-size:17px;color:var(--mut);white-space:nowrap;min-height:40px}
.tabs button.on{background:var(--red);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.chip.r{background:var(--redbg);color:var(--red2);border-color:transparent}.chip.g{background:var(--grnbg);color:var(--grn);border-color:transparent}.chip.y{background:var(--goldbg);color:var(--gold);border-color:transparent}.chip.bl{background:var(--bluebg);color:var(--blue);border-color:transparent}
.big{font-family:"Big Shoulders Display";font-weight:800;font-size:34px;line-height:1}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--grn);border-radius:6px}
.bar.gd>i{background:var(--gold)}.bar.rd>i{background:var(--red)}
.li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.li:last-child{border-bottom:0}
.num{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:"Big Shoulders Display";font-weight:800;font-size:16px;color:#fff}
.ovr{font-family:"Big Shoulders Display";font-weight:800;font-size:24px;min-width:34px;text-align:right}
.pos{font-size:12px;font-weight:700;padding:1px 6px;border-radius:6px}
.pos.GK{background:var(--goldbg);color:var(--gold)}.pos.DF{background:var(--bluebg);color:var(--blue)}.pos.MF{background:var(--grnbg);color:var(--grn)}.pos.AM{background:light-dark(#efe6fb,#2c2140);color:light-dark(#6c3bb5,#b993f5)}.pos.ST{background:var(--redbg);color:var(--red2)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mut);font-weight:600;text-align:right;padding:6px 4px;font-size:12px}
td{padding:7px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td:first-child,th:first-child{text-align:left}
td.cl,th.cl{text-align:left}
tr.me td{background:var(--redbg);font-weight:700}
tr.up td:first-child{box-shadow:inset 3px 0 var(--grn)}tr.dn td:first-child{box-shadow:inset 3px 0 var(--red)}
.scroll{overflow-x:auto}
input[type=text],input[type=number],select,textarea{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px;width:100%}
label.f{display:block;margin-bottom:10px}label.f span{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:4px}
.crest{flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.match .nm{font-family:"Big Shoulders Display";font-weight:800;font-size:22px;line-height:1.05;margin-top:6px}
.form{display:flex;gap:4px}.form i{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;color:#fff}
.W{background:var(--grn)}.D{background:#8a8f8b}.L{background:var(--red)}
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,11,.55);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 28px;animation:up .22s ease}
@media(min-width:700px){#modal{align-items:center}#modal .sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media(prefers-reduced-motion:reduce){#modal .sheet{animation:none}}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;display:none;max-width:90vw}
.pitchwrap{position:relative;background:#1f4a2b;border-radius:18px;padding:10px;margin-bottom:12px}
#cv{width:100%;display:block;border-radius:10px;aspect-ratio:68/100;max-height:62vh;margin:0 auto}
.score{display:flex;justify-content:center;margin-bottom:10px}
.score>div{display:flex;align-items:stretch;border-radius:12px;overflow:hidden;font-family:"Big Shoulders Display";font-weight:800;font-size:24px;background:#17191a;color:#fff}
.score span{padding:6px 12px}
.tick{background:var(--grn);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;min-height:56px;margin-bottom:10px}
.tick b{font-family:"Big Shoulders Display";font-size:24px;border-right:3px solid rgba(255,255,255,.4);padding-right:12px}
.tick.goal{background:var(--red)}.tick.story{background:#2b3f8a}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:10px}
.ctrl button{border:0;background:none;border-radius:10px;min-width:48px;min-height:44px;font-family:"Big Shoulders Display";font-weight:800;font-size:20px}
.ctrl button.on{background:var(--red);color:#fff}
.log{max-height:220px;overflow:auto;font-size:14px}
.log div{padding:5px 0;border-bottom:1px solid var(--line)}.log div.g{font-weight:700;color:var(--red2)}
.prof{border-radius:14px;padding:10px;text-align:center;background:var(--card2);border:1px solid var(--line)}
.prof.top{background:var(--grnbg);border-color:var(--grn)}
.prof .big{font-size:30px}
.mailrow{display:flex;gap:12px;align-items:center}
.mi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:20px}
.unread{width:10px;height:10px;border-radius:50%;background:var(--grn);flex:none}
.tier{width:54px;flex:none;text-align:center;border-radius:12px;background:var(--card2);padding:6px 0;border:1px solid var(--line)}
.tier b{display:block;font-family:"Big Shoulders Display";font-size:26px;line-height:1}
.hero{border-radius:20px;padding:20px;background:var(--red);color:#fff;margin-bottom:14px;position:relative;overflow:hidden}
.hero .lbl{color:rgba(255,255,255,.8)}
.cab{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.cup{background:var(--goldbg);border-radius:14px;padding:12px;text-align:center}
.cup svg{width:38px;height:38px;color:var(--gold)}
.runlist{max-height:46vh;overflow:auto}
.runlist .li{cursor:default}
.empty{padding:22px;text-align:center;color:var(--mut)}
.store-item{display:flex;gap:12px;align-items:flex-start}
.store-ic{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;background:var(--goldbg);color:var(--gold)}
.store-ic svg{width:24px;height:24px}
.toggle{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;border:0;flex:none}
.toggle.on{background:var(--grn)}.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}.toggle.on::after{left:25px}
.startbg{min-height:100vh;background:var(--red);color:#fff;padding:24px 16px}
.startbg .card{color:var(--ink)}
.dino{image-rendering:pixelated}
.att{display:grid;grid-template-columns:62px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:14px;font-weight:600}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:14px;font-weight:600;cursor:pointer;margin:0 6px 6px 0;min-height:36px}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{font-size:12px;color:var(--mut)}

#nav{grid-template-columns:repeat(6,1fr)}
#nav button{font-size:12px}
.tpill{display:inline-block;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700;margin:2px 0;line-height:1.3}
.tpill.sel{outline:3px solid var(--ink);outline-offset:1px}
.tdot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-left:2px}
.bar2{position:relative;height:8px;border-radius:6px;background:var(--line)}.bar2>i{position:absolute;left:0;top:0;bottom:0;background:var(--grn);border-radius:6px}.bar2>b{position:absolute;top:-3px;width:3px;height:14px;background:var(--ink);border-radius:2px}
.att{grid-template-columns:70px 1fr 82px}
.codex{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.codex>div{background:var(--card2);border-radius:10px;padding:8px}
.enc p{margin:0 0 10px}
.log div.mut{color:var(--mut);font-weight:400}
#skpop{position:fixed;z-index:70;display:none;max-width:300px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px}
[data-sk]{cursor:help;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.btn:active,.li:active,.pill:active,.tabs button:active,#nav button:active,.card[data-a]:active,.toggle:active{transform:scale(.97);filter:brightness(.95)}
@media(prefers-reduced-motion:reduce){.btn:active,.li:active{transform:none}}

/* coach screens */
.caps{text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.mgr{padding:18px}.mgr h2{font-size:30px}.tapname{cursor:pointer}
.hr{height:1px;background:var(--line);margin:14px 0}
.split>div+div{border-left:2px solid var(--line);padding-left:14px}
.cst{cursor:help;-webkit-user-select:none;user-select:none}.big2{font-size:40px;line-height:1}.big2 .up{font-size:15px;color:var(--grn);margin-left:3px}
.seg{height:9px;border-radius:9px;background:var(--line);margin:6px 0 4px;overflow:hidden}.seg i{display:block;height:100%;background:#b07a2c;border-radius:9px;transition:width .6s cubic-bezier(.2,.9,.3,1)}
.lbl2{font-weight:700;color:var(--mut);font-size:15px}
.heartb{border:0;background:none;padding:0;cursor:help}
.btn.bigg{background:linear-gradient(100deg,#1d9a6c,#0c6b4c);color:#fff;border:0;font-family:"Big Shoulders Display";font-size:28px;min-height:64px;border-radius:20px;box-shadow:0 6px 16px rgba(12,107,76,.25)}
.sect{display:flex;align-items:center;gap:12px;margin:22px 4px 10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px}.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.mv{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px;color:inherit}
.mv.red{background:var(--redbg);border-color:color-mix(in srgb,var(--red2) 35%,transparent)}.mv.plain{opacity:.8}
.mvi{flex:none;width:52px;height:52px;border-radius:14px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--mut)}.mvi.w{background:var(--card);color:var(--red2)}
.mvt{flex:1;display:flex;flex-direction:column}.mvt b{font-size:18px}.mvt span{color:var(--mut)}.mvc{color:var(--mut)}.r{color:var(--red2)}
.crow{display:flex;align-items:center;gap:12px;padding:14px;margin:0 0 10px;background:var(--card);border:1px solid var(--line);border-radius:18px;cursor:pointer}.card:has(>.crow){background:none;border:0;padding:0}.card:has(>.crow)>h3,.card:has(>.crow)>.lbl,.card:has(>.crow)>.note{margin:0 4px 8px;display:block}.cr2{font-size:30px;line-height:1;white-space:nowrap}.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:4px 4px 6px;font-size:13px;font-weight:600;color:var(--mut)}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:3px}.crow:active{background:var(--card2)}
.ct{flex:1}.cr{display:flex;flex-direction:column;align-items:center}.starb{border:0;background:none;padding:6px;color:var(--mut);min-width:40px;min-height:40px}
.hexb{flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.18))}
.hfoot{position:sticky;bottom:64px;z-index:5;display:flex;align-items:center;gap:10px;background:var(--bg);border-top:1px solid var(--line);padding:12px 2px;margin-top:16px}.hfoot>span{flex:1}
.btn.redb{background:var(--redbg);color:var(--red2);border-color:color-mix(in srgb,var(--red2) 35%,transparent)}
.fc{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:96px;color:inherit}
.fh{display:flex;align-items:center;gap:8px;color:var(--mut);font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.04em}
.fv{font-size:28px;display:flex;align-items:center;gap:4px;color:var(--ink)}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}.segs i{height:7px;border-radius:7px;background:var(--line)}.segs i.on{background:var(--grn)}
.costc{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:2px 12px;font-size:24px}
.shadow-box{background:var(--redbg);border-color:color-mix(in srgb,var(--red2) 30%,transparent)}
.dotp{width:12px;height:12px;border-radius:50%;background:var(--red2);animation:dotp 1.6s ease-in-out infinite}@keyframes dotp{50%{opacity:.35;transform:scale(.7)}}
.grab{width:56px;height:5px;border-radius:5px;background:var(--line);margin:-4px auto 14px}
.shic{width:52px;height:52px;border-radius:14px;background:var(--grnbg);color:var(--grn);display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--grn) 30%,transparent)}
.optlist{display:flex;flex-direction:column;gap:10px;max-height:58vh;overflow:auto;padding:2px}
.opt{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;color:inherit;text-align:left}.opt.on{background:var(--grnbg);border:2px solid var(--grn)}
.opt .ab{flex:none;min-width:58px;height:58px;padding:0 6px;border-radius:14px;display:grid;place-items:center;font-size:22px;color:#4e7c69}.chk{color:var(--grn);font-size:26px;font-weight:800}
.hq{width:100%;border:1px solid var(--line);background:var(--card2);border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:17px}
.lgc{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px;color:inherit}.lgc.on{border:2px solid var(--grn)}
.tierb{flex:none;width:62px;height:62px;border-radius:14px;background:var(--card2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}.tierb small{font-size:11px;color:var(--mut);font-weight:700}.tierb b{font-size:30px}.tierb.on{background:var(--grnbg);color:var(--grn)}
.lgst{gap:6px;color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;flex-wrap:wrap}.lgst b{font-size:20px;color:var(--ink)}
.ripc{overflow:hidden}.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}@keyframes rip{to{transform:scale(1);opacity:0}}
[data-a],.btn,.mv,.fc,.opt,.lgc,.crow{transition:transform .12s ease,filter .12s ease,box-shadow .12s}

<!DOCTYPE html>
<html lang="en">

<title>Lophus Football Fun</title>

/* VOICE: a cheeky matchday programme crossed with the club office ledger

   PICTURE: the live 2D pitch and the crest-vs-crest next-match card

:root{color-scheme:light dark;
--bg:light-dark(#efeee8,#111413);--card:light-dark(#ffffff,#1b1f1d);--card2:light-dark(#f6f5f0,#232826);
--ink:light-dark(#17191a,#eef1ed);--mut:light-dark(#676c68,#9aa29d);--line:light-dark(#e0dfd7,#2e3431);
--red:#e2412a;--red2:light-dark(#c3311c,#ff6b52);--redbg:light-dark(#fde9e4,#3a1d18);
--grn:light-dark(#18804a,#3fcf7d);--grnbg:light-dark(#e3f3e9,#173326);
--gold:light-dark(#9a6a12,#e9b24b);--goldbg:light-dark(#f8efdc,#352a15);
--blue:light-dark(#2459b8,#7aa5f5);--bluebg:light-dark(#e6eefc,#1b2741);
--pitch:#2e6a3c;--pitch2:#357546}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;line-height:1.05;margin:0}
h1{font-size:34px}h2{font-size:26px}h3{font-size:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:1100px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px}
#top .t1{font-weight:700;font-size:15px;line-height:1.2}#top .t2{color:var(--mut);font-size:13px}
#top .right{margin-left:auto;text-align:right}
#top .date{font-family:"Big Shoulders Display";font-weight:800;font-size:20px;line-height:1}
#view{flex:1;padding:16px 16px 100px}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
#nav button{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--mut);position:relative;min-height:56px}
#nav button.on{color:var(--red2)}#nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--red);border-radius:0 0 3px 3px}
#nav svg{width:24px;height:24px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:0 6px;line-height:18px}
@media(min-width:900px){#app{flex-direction:row;flex-wrap:wrap}#top{width:100%}#nav{position:sticky;top:60px;align-self:flex-start;width:120px;display:flex;flex-direction:column;border:0;background:none;padding-top:12px}#nav button{flex-direction:row;justify-content:flex-start;gap:10px;padding:12px 14px;font-size:15px}#nav button.on::before{left:0;right:auto;top:20%;bottom:20%;width:3px;height:auto}.badge{position:static}#view{width:calc(100% - 120px);padding-bottom:40px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card.flat{background:var(--card2)}
.lbl{color:var(--mut);font-size:13px;font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.sp{margin-left:auto}
.mut{color:var(--mut)}.sm{font-size:13px}.b{font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

.btn{border:0;border-radius:14px;padding:12px 18px;min-height:44px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.btn.pri{background:var(--red);color:#fff;border-color:var(--red);font-family:"Big Shoulders Display";font-size:22px;letter-spacing:.01em}
.btn.grn{background:var(--grn);color:#fff;border-color:var(--grn)}
.btn.ghost{background:none}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,#nav button:focus-visible,.tabs button:focus-visible,.li:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.tabs{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:9px 10px;font-family:"Big Shoulders Display";font-weight:800;font-size:17px;color:var(--mut);white-space:nowrap;min-height:40px}
.tabs button.on{background:var(--red);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.chip.r{background:var(--redbg);color:var(--red2);border-color:transparent}.chip.g{background:var(--grnbg);color:var(--grn);border-color:transparent}.chip.y{background:var(--goldbg);color:var(--gold);border-color:transparent}.chip.bl{background:var(--bluebg);color:var(--blue);border-color:transparent}
.big{font-family:"Big Shoulders Display";font-weight:800;font-size:34px;line-height:1}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--grn);border-radius:6px}
.bar.gd>i{background:var(--gold)}.bar.rd>i{background:var(--red)}
.li{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.li:last-child{border-bottom:0}
.num{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:"Big Shoulders Display";font-weight:800;font-size:16px;color:#fff}
.ovr{font-family:"Big Shoulders Display";font-weight:800;font-size:24px;min-width:34px;text-align:right}
.pos{font-size:12px;font-weight:700;padding:1px 6px;border-radius:6px}
.pos.GK{background:var(--goldbg);color:var(--gold)}.pos.DF{background:var(--bluebg);color:var(--blue)}.pos.MF{background:var(--grnbg);color:var(--grn)}.pos.AM{background:light-dark(#efe6fb,#2c2140);color:light-dark(#6c3bb5,#b993f5)}.pos.ST{background:var(--redbg);color:var(--red2)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mut);font-weight:600;text-align:right;padding:6px 4px;font-size:12px}
td{padding:7px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td:first-child,th:first-child{text-align:left}
td.cl,th.cl{text-align:left}
tr.me td{background:var(--redbg);font-weight:700}
tr.up td:first-child{box-shadow:inset 3px 0 var(--grn)}tr.dn td:first-child{box-shadow:inset 3px 0 var(--red)}
.scroll{overflow-x:auto}
input[type=text],input[type=number],select,textarea{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px;width:100%}
label.f{display:block;margin-bottom:10px}label.f span{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:4px}
.crest{flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.match .nm{font-family:"Big Shoulders Display";font-weight:800;font-size:22px;line-height:1.05;margin-top:6px}
.form{display:flex;gap:4px}.form i{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;color:#fff}
.W{background:var(--grn)}.D{background:#8a8f8b}.L{background:var(--red)}
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,11,.55);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px 28px;animation:up .22s ease}
@media(min-width:700px){#modal{align-items:center}#modal .sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}

#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;display:none;max-width:90vw}
.pitchwrap{position:relative;background:#1f4a2b;border-radius:18px;padding:10px;margin-bottom:12px}
#cv{width:100%;display:block;border-radius:10px;aspect-ratio:68/100;max-height:62vh;margin:0 auto}
.score{display:flex;justify-content:center;margin-bottom:10px}
.score>div{display:flex;align-items:stretch;border-radius:12px;overflow:hidden;font-family:"Big Shoulders Display";font-weight:800;font-size:24px;background:#17191a;color:#fff}
.score span{padding:6px 12px}
.tick{background:var(--grn);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;min-height:56px;margin-bottom:10px}
.tick b{font-family:"Big Shoulders Display";font-size:24px;border-right:3px solid rgba(255,255,255,.4);padding-right:12px}
.tick.goal{background:var(--red)}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:10px}
.ctrl button{border:0;background:none;border-radius:10px;min-width:48px;min-height:44px;font-family:"Big Shoulders Display";font-weight:800;font-size:20px}
.ctrl button.on{background:var(--red);color:#fff}
.log{max-height:220px;overflow:auto;font-size:14px}
.log div{padding:5px 0;border-bottom:1px solid var(--line)}.log div.g{font-weight:700;color:var(--red2)}
.prof{border-radius:14px;padding:10px;text-align:center;background:var(--card2);border:1px solid var(--line)}
.prof.top{background:var(--grnbg);border-color:var(--grn)}
.prof .big{font-size:30px}
.mailrow{display:flex;gap:12px;align-items:center}
.mi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:20px}
.unread{width:10px;height:10px;border-radius:50%;background:var(--grn);flex:none}
.tier{width:54px;flex:none;text-align:center;border-radius:12px;background:var(--card2);padding:6px 0;border:1px solid var(--line)}
.tier b{display:block;font-family:"Big Shoulders Display";font-size:26px;line-height:1}
.hero{border-radius:20px;padding:20px;background:var(--red);color:#fff;margin-bottom:14px;position:relative;overflow:hidden}
.hero .lbl{color:rgba(255,255,255,.8)}
.cab{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.cup{background:var(--goldbg);border-radius:14px;padding:12px;text-align:center}
.cup svg{width:38px;height:38px;color:var(--gold)}
.runlist{max-height:46vh;overflow:auto}
.runlist .li{cursor:default}
.empty{padding:22px;text-align:center;color:var(--mut)}
.store-item{display:flex;gap:12px;align-items:flex-start}
.store-ic{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;background:var(--goldbg);color:var(--gold)}
.store-ic svg{width:24px;height:24px}
.toggle{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;border:0;flex:none}
.toggle.on{background:var(--grn)}.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}.toggle.on::after{left:25px}
.startbg{min-height:100vh;background:var(--red);color:#fff;padding:24px 16px}
.startbg .card{color:var(--ink)}
.dino{image-rendering:pixelated}
.att{display:grid;grid-template-columns:62px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:14px;font-weight:600}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:14px;font-weight:600;cursor:pointer;margin:0 6px 6px 0;min-height:36px}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{font-size:12px;color:var(--mut)}
</style>

function genFixtures(){
  S.fx=S.fx.filter(f=>false);const sd=seasonStart(S.season);
  for(let t=1;t<=5;t++){
    const ids=shuffle(Object.values(S.clubs).filter(c=>c.t===t).map(c=>c.id));const n=ids.length,a=ids.slice(),rounds=[];
    for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const h=a[i],w=a[n-1-i];m.push(r%2?[w,h]:[h,w])}rounds.push(m);a.splice(1,0,a.pop())}
    const all=rounds.concat(rounds.map(rd=>rd.map(([h,w])=>[w,h])));
    all.forEach((rd,r)=>rd.forEach(([h,w])=>S.fx.push({d:sd+37+r*9,r:r+1,t,h,a:w,hs:null,as:null})));
  }
}
function table(t){
  const rows={};Object.values(S.clubs).filter(c=>c.t===t).forEach(c=>rows[c.id]={c:c.id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  for(const f of S.fx){if(f.t!==t||f.hs===null||!rows[f.h]||!rows[f.a])continue;const H=rows[f.h],A=rows[f.a];H.p++;A.p++;H.gf+=f.hs;H.ga+=f.as;A.gf+=f.as;A.ga+=f.hs;
    if(f.hs>f.as){H.w++;A.l++;H.pts+=3}else if(f.hs<f.as){A.w++;H.l++;A.pts+=3}else{H.d++;A.d++;H.pts++;A.pts++}}
  return Object.values(rows).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||S.clubs[a.c].name.localeCompare(S.clubs[b.c].name));
}

const STAT=[['Title favourite','g'],['Contender','g'],['Comfortable','bl'],['Low risk','bl'],['High risk','y'],['Relegation favourite','r']];
function statusOf(c){const r=repRank(c);if(c.t===1&&c.big)return['Big Six','y',r<=2?1:3];const i=r<=2?0:r<=5?1:r<=8?2:r<=11?3:r<=14?4:5;return[STAT[i][0],STAT[i][1],[1,4,7,10,13,14][i]]}

/* ---------- line-ups and matches ---------- */
function pickXI(cid){
  const c=S.clubs[cid],co=S.C[c.coach],tac=co?co.tac:'Total Football',form=co?co.form:'4-4-2';
  const pool=sq(cid).filter(p=>p.inj<=0);const slots=FORMS[form];const used=new Set();const xi=new Array(slots.length).fill(null);
  const order=slots.map((s,i)=>i).sort((a,b)=>(slots[a][0]==='GK'?0:1)-(slots[b][0]==='GK'?0:1));
  if(S.me&&cid===S.me.cid){for(const pid of S.me.force){const p=S.P[pid];if(!p||p.club!==cid||p.inj>0||p.yth)continue;let best=-1,bv=-1e9;for(const i of order){if(xi[i])continue;const v=-pen(p.pos,slots[i][0]);if(v>bv){bv=v;best=i}}if(best>=0){xi[best]=p;used.add(p.id)}}}
  for(const i of order){if(xi[i])continue;let bp=null,bv=-1e9;for(const p of pool){if(used.has(p.id))continue;const v=fit(p,tac)-pen(p.pos,slots[i][0]);if(v>bv){bv=v;bp=p}}if(bp){xi[i]=bp;used.add(bp.id)}}
  return{xi,slots,tac,form,bench:pool.filter(p=>!used.has(p.id)).sort((a,b)=>b.ovr-a.ovr).slice(0,7)};
}
function strength(cid,L){const co=coachOf(cid);let s=0,n=0,m=0;L.xi.forEach((p,i)=>{n++;if(!p){s+=25;m+=50;return}s+=fit(p,L.tac)-pen(p.pos,L.slots[i][0]);m+=p.mo});return s/n+(co?(co.ta-60)*.08:-2)+(m/n-60)*.05}
function simMatch(f){
  const Lh=pickXI(f.h),La=pickXI(f.a);const sh=strength(f.h,Lh)+2,sa=strength(f.a,La);const d=sh-sa;
  const lh=cl(1.32*Math.exp(d/12),.15,5.5),la=cl(1.08*Math.exp(-d/12),.15,5.5);const gh=pois(lh),ga=pois(la);
  const ev=[];const mk=(side,L)=>{const on=L.xi.filter(Boolean);if(!on.length)return;const sc=wpick(on,p=>({GK:.02,DF:.5,MF:1.3,AM:3,ST:5}[p.pos])*Math.pow(p.ovr/60,2));const pool=on.filter(p=>p!==sc);const as=R()<.75&&pool.length?wpick(pool,p=>({GK:.1,DF:.8,MF:2,AM:3,ST:1.5}[p.pos])):null;ev.push({m:ri(1,90),side,sc:sc.id,as:as?as.id:0})};
  for(let i=0;i<gh;i++)mk('h',Lh);for(let i=0;i<ga;i++)mk('a',La);ev.sort((a,b)=>a.m-b.m);
  return{Lh,La,gh,ga,ev,sh,sa,poss:cl(Math.round(50+d*1.3+nrm()*4),26,74),shH:gh+ri(3,9)+(d>2?2:0),shA:ga+ri(2,8)+(d<-2?2:0)};
}
function applyMatch(f,r){
  f.hs=r.gh;f.as=r.ga;const res={h:Math.sign(r.gh-r.ga),a:Math.sign(r.ga-r.gh)};
  const G={},A={};r.ev.forEach(e=>{G[e.sc]=(G[e.sc]||0)+1;if(e.as)A[e.as]=(A[e.as]||0)+1});
  const mine=f.h===S.me.cid||f.a===S.me.cid;const rt={};
  [['h',r.Lh,f.h,r.ga],['a',r.La,f.a,r.gh]].forEach(([s,L,cid,conc])=>{L.xi.forEach(p=>{if(!p)return;
    let x=6.3+nrm()*.45+res[s]*.35+(G[p.id]||0)*1.0+(A[p.id]||0)*.6;if(p.pos==='GK'||p.pos==='DF')x+=conc===0?.6:-conc*.22;x=cl(Math.round(x*10)/10,4,10);rt[p.id]=x;
    p.sA++;p.sG+=G[p.id]||0;p.sAs+=A[p.id]||0;p.sR+=x;const ca=p.ca[cid]||(p.ca[cid]=[0,0,0]);ca[0]++;ca[1]+=G[p.id]||0;ca[2]+=A[p.id]||0;
    p.mo=cl(p.mo+res[s]*2+(x>=7.5?1:0)+(cid===S.me.cid&&res[s]>0?BONUS[S.me.bonus].mo:0),0,100);p.last=S.d;
    const ms=S.ms[p.id]||(S.ms[p.id]={a:0,r:0,g:0,as:0,c:cid});ms.a++;ms.r+=x;ms.g+=G[p.id]||0;ms.as+=A[p.id]||0;ms.c=cid;
    const injr=cid===S.me.cid?.02*(1-S.me.fac.md*.035):.02;if(R()<injr){p.inj=ri(4,38);if(cid===S.me.cid)mail('injury',{pid:p.id,days:p.inj})}
  })});
  const pts=x=>x>0?3:x===0?1:0;S.mp[f.h]=(S.mp[f.h]||0)+pts(res.h);S.mp[f.a]=(S.mp[f.a]||0)+pts(res.a);S.mg[f.h]=(S.mg[f.h]||0)+r.gh-r.ga;S.mg[f.a]=(S.mg[f.a]||0)+r.ga-r.gh;
  if(mine){
    const home=f.h===S.me.cid,gf=home?r.gh:r.ga,ga=home?r.ga:r.gh,c=me();
    f.ev=r.ev.map(e=>({m:e.m,side:e.side,sc:S.P[e.sc]?.name||'',as:e.as?S.P[e.as]?.name:''}));
    if(home){const att=Math.round(c.cap*cl(.22+c.fans/150+(5-c.t)*.04,.15,1));f.att=att;const inc=att*S.me.ticket*(1+(5-c.t)*.4);S.me.money+=inc;S.me.fin.tk+=inc}
    if(gf>ga){const b=BONUS[S.me.bonus].cost*(6-c.t);S.me.money-=b;S.me.fin.wb+=b}
    if(!S.me.unl.fanlock)c.fans=cl(c.fans+(gf>ga?1.5:gf<ga?-2:0),0,100);else c.fans=100;
    S.me.res.push({d:S.d,opp:home?f.a:f.h,home,gf,ga});if(S.me.res.length>60)S.me.res.shift();
    const diff=gf-ga;const rb=S.rec[S.me.cid]||(S.rec[S.me.cid]={});if(!rb.win||diff>rb.win.diff)if(diff>0)rb.win={diff,txt:`${gf}-${ga} v ${S.clubs[home?f.a:f.h].name}`,s:S.season};
    f.rt=rt;
  }
}

function mail(type,data={}){const M=MT[type];const acts=M.acts?M.acts(data):null;const m={id:++S.nid,d:S.d,type,data,read:false,done:!acts,from:M.from(data),cat:M.cat,title:M.title(data),imp:!!M.imp};S.mail.unshift(m);if(S.mail.length>160)S.mail.length=160;if(acts)S._stop=true;return m}
function randomMail(){
  const o=dobj(S.d);const win=o.m===6||o.m===7||o.m===0;const r=R();const my=sq(S.me.cid);if(!my.length)return;
  if(win&&r<.32){const p=wpick(my,p=>Math.pow(p.ovr/50,4));bidFor(p);return}
  if(r<.44){const L=pickXI(S.me.cid);const outs=my.filter(p=>!L.xi.includes(p)&&p.inj<=0&&S.d-p.last>20&&p.age>20).sort((a,b)=>b.ovr-a.ovr);if(outs[0]&&!S.mail.some(m=>m.type==='unhappy'&&m.data.pid===outs[0].id&&S.d-m.d<40)){mail('unhappy',{pid:outs[0].id});return}}
  if(r<.62){const p=scoutTarget();if(p)mail('scout',{pid:p.id});return}
  if(r<.69){const co=coachOf(S.me.cid);const w=TAC[co.tac];const emph=ATT[w.indexOf(Math.max(...w))];const L=pickXI(S.me.cid);const worst=L.xi.map((p,i)=>[p,L.slots[i][0]]).filter(x=>x[0]&&x[1]!=='GK').sort((a,b)=>fit(a[0],co.tac)-fit(b[0],co.tac))[0];mail('coachreq',{pos:worst?worst[1]:'ST',emph});return}
  if(r<.76){mail('sponsor',{name:pick(['Kestrel Energy','Borneo Brew Co.','Halcyon Motors','Pixel Peak Games','Rainforest Telecom','Northgate Insurance','Lophus Snacks','Tidewater Bank']),amt:Math.round(COMM[me().t-1]*(.3+R()*.6)/1000)*1000});return}
  if(r<.83){const p=wpick(my,p=>p.mo>60?Math.pow(p.ovr/50,3):.1);mail('raise',{pid:p.id,w:Math.round(p.wage*(1.25+R()*.4)/100)*100});return}
  if(r<.89&&my.length>4){const a=pick(my),b=pick(my.filter(x=>x!==a));mail('dressing',{a:a.id,b:b.id});return}
  if(r<.95){mail('media',{q:pick(['Can this squad really meet the board\'s target?','Is the coach the right man for the job?','Are the fans right to be worried?','Who is the best player in your dressing room?','Should the club be spending more?'])});return}
  mail('fans',{});
}
function bidFor(p){const c=me();const buyers=Object.values(S.clubs).filter(x=>x.id!==c.id&&x.t<=c.t+1&&x.t>=c.t-2);const b=pick(buyers);mail('bid',{pid:p.id,club:b.id,fee:Math.round(p.val*(.8+R()*.75)/1000)*1000})}
function scoutTarget(){const co=coachOf(S.me.cid);const myAvg=avgOvr(S.me.cid);const t=me().t;
  if(R()<.5){const c=Object.values(S.P).filter(p=>p.club&&p.club!==S.me.cid&&!p.yth&&Math.abs(S.clubs[p.club].t-t)<=1&&fit(p,co.tac)>=myAvg+1);if(c.length)return pick(c)}
  const p=genPlayer(pick(POSL.slice(1)),myAvg+ri(-2,6)+S.me.fac.sc,ri(17,30),0,S.me.fac.sc);return p}
const avgOvr=cid=>{const L=pickXI(cid).xi.filter(Boolean);return Math.round(L.reduce((s,p)=>s+p.ovr,0)/(L.length||1))};
const faFee=p=>Math.round(p.val*.3/1000)*1000;
function addShort(id){if(!S.me.short.includes(id))S.me.short.unshift(id)}
function agency(pos,minOvr,maxAge,emph,n){const out=[];const lvl=S.me.fac.sc;for(let i=0;i<n;i++){const age=ri(17,Math.max(17,maxAge));let tgt=minOvr+ri(0,4)+Math.floor(lvl/2);if(!boss()&&!S.me.unl.eyes&&R()<.3)tgt-=ri(2,6);const p=genPlayer(pos||pick(POSL.slice(1)),tgt,age,0,lvl+(S.me.unl.eyes?3:0),emph);out.push(p);addShort(p.id)}return out}
function trySign(p,fee){fee=fee??(p.club?p.val:faFee(p));if(p.club===S.me.cid)return'Already ours.';
  if(S.me.money<fee)return `Not enough money: you need ${money(fee)}, you have ${money(S.me.money)}. Top up in the Store.`;
  if(!boss()){if(p.club&&fee<p.val*.95&&R()<.7)return `${S.clubs[p.club].name} rejected ${money(fee)}.`;if(p.club&&R()<(S.clubs[p.club].big?.4:.2))return `${S.clubs[p.club].name} refuse to sell.`;if(R()>interest(p))return p.club&&S.clubs[p.club].t<me().t?`${p.name} won't drop down to the ${LG[me().t-1]} to join a club your size.`:`${p.name} isn't interested in joining ${me().name}.`}
  const from=p.club;S.me.money-=fee;S.me.fin.tr-=fee;p.club=S.me.cid;p.yth=false;SQ=null;p.num=freeNum(S.me.cid);p.mo=cl(p.mo+10,0,100);p.last=S.d;S.me.short=S.me.short.filter(x=>x!==p.id);
  if(from)refill(from);S.me.log.push({s:S.season,d:S.d,txt:`Signed ${p.name} for ${money(fee)}`});return `${p.name} signs! Fee ${money(fee)}.`}
function sellTo(p,club,fee){p.club=club;SQ=null;p.num=freeNum(club);S.me.money+=fee;S.me.fin.tr+=fee;S.me.force=S.me.force.filter(x=>x!==p.id);S.me.log.push({s:S.season,d:S.d,txt:`Sold ${p.name} to ${S.clubs[club].name} for ${money(fee)}`})}
function refill(cid){const c=S.clubs[cid];const s=sq(cid);for(const pos of POSL){const have=s.filter(p=>p.pos===pos).length;for(let k=have;k<NEED[pos];k++){const p=genPlayer(pos,TQ[c.t-1]+Math.round(nrm()*3),ri(18,30),cid);SQ=null;p.num=freeNum(cid)}}}

/* ---------- time ---------- */
function advanceDay(){
  S.d++;const o=dobj(S.d);
  if(o.m===6&&o.day===1)endSeason();
  if(o.day===1)monthly(o);
  if(o.m===3&&o.day===1)youthIntake();
  if(o.wd===1)develop();
  for(const p of Object.values(S.P))if(p.inj>0)p.inj--;
  S.pend=S.pend.filter(x=>{if(x.d>S.d)return true;const p=S.P[x.pid];if(x.type==='bidfor'&&p&&p.club===S.me.cid)bidFor(p);return false});
  if(R()<.2)randomMail();
}
function monthly(o){
  const pm=(o.m+11)%12;if([7,8,9,10,11,0,1,2,3].includes(pm)&&Object.keys(S.ms).length)awardsMonth(pm,o.m===0?o.y-1:o.y);
  S.ms={};S.mp={};S.mg={};
  const c=me();const co=coachOf(S.me.cid);const w=sq(S.me.cid).reduce((s,p)=>s+p.wage,0)+youth(S.me.cid).length*400+(co?co.wage:0);
  const net=[15e3,40e3,90e3,180e3,350e3][S.me.fac.sc-1];const inc=Math.round(COMM[c.t-1]*(.6+c.rep/150));
  S.me.money+=inc-w-net;S.me.fin.hist.unshift({m:pm,y:o.m===0?o.y-1:o.y,inc:inc+S.me.fin.tk+S.me.fin.tr,out:w+net+S.me.fin.wb});S.me.fin.hist.length=Math.min(S.me.fin.hist.length,24);S.me.fin.tk=0;S.me.fin.tr=0;S.me.fin.wb=0;
  if(S.me.unl.fanlock)c.fans=100;
  S.pool=S.pool.filter(id=>S.C[id]&&!S.C[id].club);while(S.pool.length<8)S.pool.push(genCoach(ri(50,80)).id);
  if(S.me.money<0&&!S._warned){S._warned=true;mail('board',{title:'We are in the red',html:`<p>The club account is at <b>${money(S.me.money)}</b>. As chairman you can top up any time from the Store.</p>`})}
}
function awardsMonth(m,y){
  const t=me().t;const c=Object.entries(S.ms).map(([id,v])=>({p:S.P[id],...v})).filter(x=>x.p&&S.clubs[x.c]&&S.clubs[x.c].t===t&&x.a>=2);if(!c.length)return;
  const sc=x=>x.r/x.a+x.g*.18+x.as*.1;c.sort((a,b)=>sc(b)-sc(a));const P=c[0];const Y=c.filter(x=>x.p.age<=21)[0];
  const cl2=Object.values(S.clubs).filter(x=>x.t===t).sort((a,b)=>(S.mp[b.id]||0)-(S.mp[a.id]||0)||(S.mg[b.id]||0)-(S.mg[a.id]||0))[0];const CO=S.C[cl2.coach];
  const lab=`${MON[m]} ${y}`;
  const rec={s:S.season,m,y,t,potm:{id:P.p.id,name:P.p.name,club:P.c,avg:(P.r/P.a).toFixed(2),g:P.g},ypotm:Y?{id:Y.p.id,name:Y.p.name,club:Y.c,avg:(Y.r/Y.a).toFixed(2),g:Y.g}:null,cotm:{id:CO?.id,name:CO?.name||'—',club:cl2.id,pts:S.mp[cl2.id]||0}};S.aw.unshift(rec);
  P.p.aw.push(`Player of the Month · ${lab}`);if(Y)Y.p.aw.push(`Young Player of the Month · ${lab}`);if(CO)CO.aw.push(`Coach of the Month · ${lab}`);
  const ours=[P.c===S.me.cid,Y&&Y.c===S.me.cid,cl2.id===S.me.cid].filter(Boolean).length;if(ours){me().fans=cl(me().fans+2*ours,0,100);me().rep=cl(me().rep+ours*.5,0,99)}
  mail('award',{title:`${LG[t-1]} awards · ${lab}`,html:`<p><b>Player of the Month:</b> ${esc(P.p.name)} (${esc(S.clubs[P.c].name)}) · avg ${rec.potm.avg}, ${P.g} goals</p>${Y?`<p><b>Young Player of the Month:</b> ${esc(Y.p.name)} (${esc(S.clubs[Y.c].name)})</p>`:''}<p><b>Coach of the Month:</b> ${esc(rec.cotm.name)} (${esc(cl2.name)}) · ${rec.cotm.pts} pts</p>${ours?'<p class="b" style="color:var(--grn)">One of ours won! Fans and reputation up.</p>':''}`});
}
function develop(){
  for(const p of Object.values(S.P)){if(!p.club)continue;const c=S.clubs[p.club];const mine=p.club===S.me.cid;const tr=mine?S.me.fac.tr:cl(16-c.t*3,2,15);const co=S.C[c.coach];let ch=0;
    if(p.age<=24&&p.ovr<p.pot){if(R()<.1+tr*.012+((co?co.dv:60)-60)*.002+(p.yth&&mine?S.me.fac.ac*.004:0))ch=1}else if(p.age>=31&&R()<.05+(p.age-31)*.03)ch=-1;
    if(ch){const w=PW[p.pos];const k=ch>0?wpick(ATT,x=>w[ATT.indexOf(x)]+.1):pick(['fast','phy','fast']);const before=p.ovr;p[k]=cl(p[k]+ch*ri(1,2),15,99);p.ovr=calcOvr(p);if(p.ovr!==before){if(mine){if(p.ovr>before)S.me.mv.up++;else S.me.mv.dn++}}}}
}
function youthIntake(){const lvl=S.me.fac.ac;const n=3+Math.floor(lvl/4);const ps=[];for(let i=0;i<n;i++){const p=genPlayer(pick(POSL),36+lvl*1.3+S.me.fac.sc*1.2+Math.round(nrm()*4),ri(15,17),S.me.cid,Math.floor(lvl/2));p.yth=true;ps.push(p)}SQ=null;

function endSeason(){
  const s=S.season;const rec={s,tiers:[]};const mv=[];const c=me();const myT=c.t;const exp=expectation();
  for(let t=1;t<=5;t++){const tb=table(t);if(!tb.length)continue;
    tb.forEach((r,i)=>S.clubs[r.c].hist.push({s,t,pos:i+1,pts:r.pts,w:r.w,d:r.d,l:r.l,gf:r.gf,ga:r.ga}));
    const ch=S.clubs[tb[0].c];ch.troph.push({s,n:`${LG[t-1]} champions`});ch.rep=cl(ch.rep+5,0,99);
    if(t>1){mv.push([tb[0].c,t-1],[tb[1].c,t-1]);S.clubs[tb[1].c].troph.push({s,n:`Promoted from ${LG[t-1]}`});S.clubs[tb[1].c].rep=cl(S.clubs[tb[1].c].rep+4,0,99);ch.rep=cl(ch.rep+2,0,99)}
    if(t<5){mv.push([tb[tb.length-1].c,t+1],[tb[tb.length-2].c,t+1]);[tb.length-1,tb.length-2].forEach(i=>S.clubs[tb[i].c].rep=cl(S.clubs[tb[i].c].rep-5,0,99))}
    const pl=Object.values(S.P).filter(p=>p.club&&S.clubs[p.club].t===t&&!p.yth);const ts=pl.slice().sort((a,b)=>b.sG-a.sG)[0];const pots=pl.filter(p=>p.sA>=15).sort((a,b)=>b.sR/b.sA-a.sR/a.sA)[0];
    if(ts)ts.aw.push(`Golden Boot · ${LG[t-1]} ${seasonLbl(s)}`);if(pots)pots.aw.push(`Player of the Season · ${LG[t-1]} ${seasonLbl(s)}`);
    rec.tiers.push({t,champ:tb[0].c,champName:ch.name,ts:ts?{name:ts.name,club:ts.club,g:ts.sG}:null,pots:pots?{name:pots.name,club:pots.club,avg:(pots.sR/pots.sA).toFixed(2)}:null,table:tb.map(r=>[r.c,r.pts])});
  }

  mv.forEach(([id,t])=>S.clubs[id].t=t);
  const hit=pos<=exp.tgt;c.fans=S.me.unl.fanlock?100:cl(c.fans+(hit?8:-10),0,100);c.rep=cl(c.rep+(hit?2:-2),0,99);
  const pr=Object.values(S.P);for(const p of pr){p.age++;if(p.club===S.me.cid&&!p.yth&&p.sA)p.seasons=(p.seasons||0)+1;p.sA=p.sG=p.sAs=p.sR=0;
    if(p.age>=33&&R()<(p.age-32)*.2){const ca=p.ca[S.me.cid];if(ca&&ca[0]>=10)S.retired.push({name:p.name,pos:p.pos,apps:ca[0],g:ca[1],as:ca[2],peak:p.ovr,ret:s,aw:p.aw});if(p.club===S.me.cid)S.me.log.push({s,d:S.d,txt:`${p.name} retired`});delete S.P[p.id];S.me.short=S.me.short.filter(x=>x!==p.id);S.me.force=S.me.force.filter(x=>x!==p.id);continue}
    if(p.yth&&p.age>=19){p.yth=false}
    setVal(p)}
  for(const id in S.P){const p=S.P[id];if(!p.club&&!S.me.short.includes(p.id))delete S.P[id]}
  SQ=null;for(const cc of Object.values(S.clubs))if(cc.id!==S.me.cid)refill(cc.id);

  S.season++;S.me.mv={up:0,dn:0};S.me.force=[];genFixtures();S._seasonEnd=true;

}

function pitchSVG(L,col){const w=340,h=470;return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:440px;display:block;margin:0 auto" role="img" aria-label="Line-up"><rect width="${w}" height="${h}" rx="14" fill="var(--pitch)"/>${[0,1,2,3,4,5].map(i=>`<rect y="${i*h/6}" width="${w}" height="${h/12}" fill="var(--pitch2)"/>`).join('')}<g fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5"><rect x="14" y="14" width="${w-28}" height="${h-28}"/><line x1="14" y1="${h/2}" x2="${w-14}" y2="${h/2}"/><circle cx="${w/2}" cy="${h/2}" r="40"/><rect x="${w/2-70}" y="${h-14-60}" width="140" height="60"/><rect x="${w/2-70}" y="14" width="140" height="60"/></g>${L.xi.map((p,i)=>{const[sp,x,y]=L.slots[i];const cx=20+x*(w-40),cy=h-24-y*(h-60)/.78;if(!p)return'';const pen2=pen(p.pos,sp);return `<g data-a="player:${p.id}" style="cursor:pointer"><circle cx="${cx}" cy="${cy}" r="15" fill="${col}" stroke="#fff" stroke-width="2"/><text x="${cx}" y="${cy+5}" text-anchor="middle" fill="#fff" font-family="Big Shoulders Display" font-weight="800" font-size="15">${p.num}</text><rect x="${cx-34}" y="${cy+17}" width="68" height="17" rx="5" fill="rgba(0,0,0,.45)"/><text x="${cx}" y="${cy+29}" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">${esc(last(p.name)).slice(0,11)}</text><rect x="${cx+8}" y="${cy-22}" width="22" height="14" rx="4" fill="#fff"/><text x="${cx+19}" y="${cy-11}" text-anchor="middle" font-size="10" font-weight="700" fill="${pen2?'#c3311c':'#18804a'}">${fit(p,L.tac)-pen2}</text></g>`}).join('')}</svg>`}
function sqXI(){const L=pickXI(S.me.cid);return `<div class="card"><div class="row" style="margin-bottom:8px"><div><div class="lbl">${esc(coName())} picks the team</div><h3>${L.form} · ${L.tac}</h3></div><span class="sp chip">Strength ${Math.round(strength(S.me.cid,L))}</span></div>${pitchSVG(L,me().col)}<p class="sm mut">Badges show each player's fit for his slot. Tap a player to ask the coach to start or drop him.</p>${S.me.force.length?`<button class="btn sm" data-a="clearforce">Clear my start requests (${S.me.force.length})</button>`:''}</div><div class="card"><h3>Bench</h3>${L.bench.map(p=>prow(p)).join('')||'<div class="empty">No bench</div>'}</div>`}
function coachPlan(){const co=coachOf(S.me.cid);const L=pickXI(S.me.cid);const s=sq(S.me.cid);const avg=avgOvr(S.me.cid);
  const weak=[];L.xi.forEach((p,i)=>{if(p&&fit(p,L.tac)-pen(p.pos,L.slots[i][0])<avg-3)weak.push(L.slots[i][0])});
  const off=s.filter(p=>!L.xi.includes(p)&&!L.bench.slice(0,5).includes(p)&&(p.age>=29||p.ovr<avg-5)).sort((a,b)=>a.ovr-b.ovr);return{weak:[...new Set(weak)],off}}

  return `<div class="card"><h3>Players to sign</h3><p class="sm mut">${esc(coName())} wants ${AL[emph]} players for ${co.tac}.</p>${weak.length?weak.map(ps=>`<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><span class="pos ${ps}">${ps}</span><span>Upgrade wanted</span><button class="btn sm sp" data-a="brief:${ps}:${emph}">Brief agency</button></div>`).join(''):'<div class="empty">Happy with the starting eleven.</div>'}</div>
  <div class="card"><h3>Players to offload</h3><p class="sm mut">“Everywhere these lads play, I already have better options. Sell and free the wages.”</p>${off.map(p=>`<div class="row">${prow(p,{val:1})}</div>`).join('')||'<div class="empty">No surplus players.</div>'}${off.length?`<button class="btn sm" data-a="listall">Put all ${off.length} up for sale</button>`:''}</div>`}

function buildLines(f,r){const H=S.clubs[f.h],A=S.clubs[f.a];const lines=[];const gm={};r.ev.forEach(e=>(gm[e.m]||(gm[e.m]=[])).push(e));

    else if(R()<.6){const side=R()*100<r.poss?'h':'a';const L=side==='h'?r.Lh:r.La,O=side==='h'?r.La:r.Lh,C=side==='h'?H:A;const a=nm(L),b=nm(L);const gk=O.xi[0]?last(O.xi[0].name):'the keeper';

  lines.push({m:90,txt:'Full-time',ft:1});return lines}

function setupCanvas(){const cv=$('#cv');if(!cv||!LM)return;const H=S.clubs[LM.f.h],A=S.clubs[LM.f.a];
  LM.players=[];[[LM.r.Lh,0,H],[LM.r.La,1,A]].forEach(([L,s,c])=>L.xi.forEach((p,i)=>{if(!p)return;const[,x,y]=L.slots[i];LM.players.push({s,p,bx:x,by:y*.92,fx:x,fy:y*.92,col:c.col,ph:R()*6})}));
  LM.hold=LM.players.find(q=>q.s===0&&q.p.pos==='MF')||LM.players[0];cancelAnimationFrame(LM.raf);LM.lt=performance.now();LM.raf=requestAnimationFrame(loop)}
function toScreen(pl,fx,fy){return pl.s===0?{x:fx,y:1-fy}:{x:1-fx,y:fy}}
function loop(now){if(!LM||LM.done)return;const cv=$('#cv');if(!cv){LM.raf=requestAnimationFrame(loop);return}
  const dt=Math.min(.1,(now-LM.lt)/1000);LM.lt=now;const sp=LM.paused?0:LM.speed;
  if(sp){LM.min+=dt*sp*.75;
    while(LM.li<LM.lines.length&&LM.lines[LM.li].m<=LM.min){const ln=LM.lines[LM.li++];if(ln.g){LM.score[ln.side==='h'?0:1]++;LM.goalT=1.4;LM.goalSide=ln.side}const lg=$('#lg');if(lg){const d=document.createElement('div');if(ln.g)d.className='g';d.textContent=`${ln.m}' ${ln.txt}`;lg.prepend(d)}$('#tkm').textContent=ln.m+"'";$('#tkt').textContent=ln.txt;$('#tk').className='tick'+(ln.g?' goal':'');$('#sc').textContent=LM.score.join('-')}
    $('#mn').textContent=Math.min(90,Math.floor(LM.min))+"'";
    if(LM.min>=90.5){finishLive();return}
    LM.tpass-=dt*sp;if(LM.goalT>0){LM.goalT-=dt*sp;const gy=LM.goalSide==='h'?.02:.98;LM.ball.tx=.5;LM.ball.ty=gy;if(LM.goalT<=0){const k=LM.players.filter(q=>q.s===(LM.goalSide==='h'?1:0)&&(q.p.pos==='ST'||q.p.pos==='MF'));LM.hold=k[0]||LM.players[0];LM.ball.x=.5;LM.ball.y=.5}}
    else if(LM.tpass<=0){LM.tpass=.55+R()*.6;const h=LM.hold;const keep=R()<(h.s===0?LM.r.poss:100-LM.r.poss)/100*.9+.08;const pool=LM.players.filter(q=>q!==h&&(keep?q.s===h.s:q.s!==h.s)&&q.p.pos!=='GK');
      const fw=keep?pool.map(q=>({q,w:1+Math.max(0,q.fy-h.fy)*3})):pool.map(q=>({q,w:1/(.05+Math.hypot(q.fx-h.fx,q.fy-(1-h.fy)))}));LM.hold=wpick(fw,o=>o.w).q}
    if(LM.goalT<=0){const t=toScreen(LM.hold,LM.hold.fx,LM.hold.fy);LM.ball.tx=t.x;LM.ball.ty=t.y}
    LM.ball.x+=(LM.ball.tx-LM.ball.x)*Math.min(1,dt*sp*5);LM.ball.y+=(LM.ball.ty-LM.ball.y)*Math.min(1,dt*sp*5);
    const att=LM.hold.s;for(const q of LM.players){const bf=q.s===0?{x:LM.ball.x,y:1-LM.ball.y}:{x:1-LM.ball.x,y:LM.ball.y};const has=q.s===att;let ty=q.by+(has?.12:-.03)+(bf.y-.5)*.3,tx=q.bx+(bf.x-q.bx)*.22+Math.sin(now/900+q.ph)*.012;if(q.p.pos==='GK'){ty=.03+Math.max(0,(bf.y-.5))*-.0+(bf.y<.3?.04:0);tx=.5+(bf.x-.5)*.2}if(q===LM.hold){tx=q.fx;ty=q.fy}q.fx+=(cl(tx,.04,.96)-q.fx)*Math.min(1,dt*sp*1.6);q.fy+=(cl(ty,.02,.97)-q.fy)*Math.min(1,dt*sp*1.6)}}
  draw(cv,now);LM.raf=requestAnimationFrame(loop)}
function draw(cv,now){const dpr=window.devicePixelRatio||1;const W=cv.clientWidth,Hh=cv.clientHeight;if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(Hh*dpr)}const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  const m=12,w=W-2*m,h=Hh-2*m;for(let i=0;i<10;i++){g.fillStyle=i%2?'#357546':'#2e6a3c';g.fillRect(0,i*Hh/10,W,Hh/10+1)}
  g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=1.5;g.strokeRect(m,m,w,h);g.beginPath();g.moveTo(m,m+h/2);g.lineTo(m+w,m+h/2);g.stroke();g.beginPath();g.arc(W/2,Hh/2,w*.14,0,7);g.stroke();
  [[m,1],[m+h,-1]].forEach(([y,d])=>{g.strokeRect(W/2-w*.3,d>0?y:y-h*.16,w*.6,h*.16);g.strokeRect(W/2-w*.14,d>0?y:y-h*.06,w*.28,h*.06);g.fillStyle='rgba(255,255,255,.85)';g.fillRect(W/2-w*.07,d>0?y-5:y,w*.14,5)});
  const r=Math.max(9,Math.min(13,w/30));g.font=`800 ${r*1.05}px "Big Shoulders Display",Impact,sans-serif`;g.textAlign='center';g.textBaseline='middle';
  for(const q of LM.players){const s=toScreen(q,q.fx,q.fy);const x=m+s.x*w,y=m+s.y*h;g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(x+1,y+r*.8,r*.9,r*.35,0,0,7);g.fill();g.fillStyle=q.p.pos==='GK'?(q.s===0?'#e8b04a':'#8f5ad6'):q.col;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.strokeStyle=q===LM.hold?'#ffe35a':'#fff';g.lineWidth=q===LM.hold?3:2;g.stroke();g.fillStyle='#fff';g.fillText(q.p.num,x,y+1)}
  const bx=m+LM.ball.x*w,by=m+LM.ball.y*h;g.fillStyle='#fff';g.beginPath();g.arc(bx,by,r*.45,0,7);g.fill();g.strokeStyle='#111';g.lineWidth=1.2;g.stroke();
  if(LM.goalT>0){g.fillStyle='rgba(226,65,42,.88)';g.fillRect(0,Hh/2-28,W,56);g.fillStyle='#fff';g.font=`900 40px "Big Shoulders Display",Impact`;g.fillText('GOAL!',W/2,Hh/2+2)}}

/* ---------- continue / run ---------- */
async function runDays(mode){if(RUN)return;RUN={stop:false,lines:[]};let reason='';
  const draw=()=>modal(`<div class="row" style="margin-bottom:6px"><span class="mi" style="background:var(--card2)">📅</span><div><div class="lbl">${fmtD(S.d)}</div><h2>Simulating</h2></div><span class="sp chip g">${mode==='cont'?'Stops at mail':'Stops at next match'}</span></div><div class="runlist">${RUN.lines.slice(-8).reverse().map(l=>`<div class="li"><span style="width:84px" class="disp">${l.d}</span><span style="flex:1"><span class="b">${esc(l.t)}</span><br><span class="sm mut">${esc(l.s)}</span></span></div>`).join('')}</div><button class="btn wide" style="margin-top:12px" data-a="stoprun">❚❚ Stop here</button>`);
  draw();let guard=0;
  while(!RUN.stop&&guard++<400){
    if(myFixtureToday()){reason='match';break}
    const games=S.fx.filter(f=>f.d===S.d&&f.hs===null).length;simOthersToday();S._stop=false;const before=S.mail[0]?.id;advanceDay();
    const newM=S.mail.filter(m=>m.d===S.d&&m.id!==before).slice(0,2);const o=dobj(S.d);
    RUN.lines.push({d:`${WD[o.wd]} ${o.day} ${MON[o.m]}`,t:newM.length?newM[0].title:games?'Matchday elsewhere':o.day===1?'Wages and bills settled':'Quiet day at the club',s:newM.length?newM[0].from:games?`${games} games played around the leagues`:o.day===1?'Payroll and running costs':'Nothing needed you.'});draw();
    if(S._seasonEnd){S._seasonEnd=false;reason='season';break}
    if(S._stop&&mode==='cont'){reason='mail';break}
    await sleep(mode==='cont'?120:28);
  }
  RUN=null;closeModal();save();
  if(reason==='match'){go('match')}else if(reason==='mail'||reason==='season'){const m=S.mail.find(m=>!m.done)||S.mail[0];render();if(m)openMail(m.id)}else render();}
function skipSeason(){const s=S.season;let g=0;while(S.season===s&&g++<400){const f=myFixtureToday();if(f)applyMatch(f,simMatch(f));simOthersToday();advanceDay()}S._seasonEnd=false;save();go('home');toast('Season complete. Check your mail for the review.')}

donematch:()=>{cancelAnimationFrame(LM?.raf);LM=null;S._stop=false;const o=dobj(S.d);advanceDay();save();go('home');if(S.mail.some(m=>m.d===S.d&&!m.done))toast('New mail is waiting.')},
copysave:()=>{const s=JSON.stringify(S);navigator.clipboard?.writeText(s).then(()=>toast(`Save code copied (${Math.round(s.length/1024)} KB).`),()=>{$('#imp').value=s;toast('Copy blocked. The code is in the box below: select all and copy.')})},
importsave:()=>{try{const o=JSON.parse($('#imp').value);if(!o.clubs||!o.me)throw 0;S=o;SQ=null;save();go('home');toast('Save loaded.')}catch(e){toast('That save code is not valid.')}},
mgrname:()=>{S.me.name=$('#mgrName').value.trim()||S.me.name;save();render()},
asknew:()=>{S.ui.confirmNew=1;render()},cancelnew:()=>{S.ui.confirmNew=0;render()},
newgame:()=>{try{localStorage.removeItem(SKEY)}catch(e){}S=null;TMP=null;render()},
st:t=>{TMP.ui.mgr=$('#mgr').value;TMP.ui.st=+t;startScreen()},
reroll:()=>{const mg=$('#mgr').value,st=TMP.ui.st;TMP=null;startScreen();TMP.ui.mgr=mg;TMP.ui.st=st;startScreen()},
pickclub:id=>{const name=$('#mgr').value.trim()||'Gaffer';S=TMP;TMP=null;const c=S.clubs[id];
  S.me={cid:+id,name,money:START[c.t-1]*(c.big?2.5:1),fac:{tr:Math.max(1,9-c.t),ac:Math.max(1,9-c.t),md:Math.max(1,9-c.t),st:Math.max(1,9-c.t),sc:1},unl:{},short:[],force:[],res:[],log:[],bonus:'Standard',ticket:[45,32,24,18,12][c.t-1],fin:{tk:0,tr:0,wb:0,hist:[]},mv:{up:0,dn:0}};
  S.me.log.push({s:S.season,d:0,txt:`${name} appointed manager of ${c.name}`});
  mail('welcome',{});
  const p=scoutTarget();if(p)mail('scout',{pid:p.id});
  V.style.padding='';save();go('home');openMail(S.mail.find(m=>m.type==='welcome').id)},
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const[a,...args]=b.dataset.a.split(':');if(A[a]){e.preventDefault();A[a](...args)}});
document.addEventListener('change',e=>{if(e.target.id==='psort'){S.ui.ps=e.target.value;render()}if(/^cd(c1|c2|ini|band)$/.test(e.target.id)){cdRead();render()}});
function cdRead(){const c=me();if(!S.ui.cd)S.ui.cd={...c.cr,ini:c.short};const d=S.ui.cd;const g=id=>document.getElementById(id);if(g('cdc1'))d.c1=g('cdc1').value;if(g('cdc2'))d.c2=g('cdc2').value;if(g('cdini'))d.ini=g('cdini').value.toUpperCase().slice(0,3);if(g('cdband'))d.band=g('cdband').checked}

function render(){if(!S||!S.me){startScreen();return}V.style.padding='';const pg=P[S.ui.pg]?S.ui.pg:'home';if(pg!=='match'&&LM&&!LM.done){}
  V.innerHTML=P[pg]();renderTop();if(pg==='match'&&LM&&!LM.done){setupCanvas()}}
if(load()&&S&&S.me){render()}else{S=null;render()}
}
</script>
</body>
</html>
